name: Deploy Aurora Dashboard

on:
  push:
    branches: [ "main" ]

jobs:
  build-push-trigger:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        if: ${{ vars.REGISTRY_URL != '' && secrets.REGISTRY_USERNAME != '' && secrets.REGISTRY_PASSWORD != '' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # 1. Build & Push to Local/Remote Registry
      - name: Build and Push Docker Image
        env:
          REGISTRY: ${{ vars.REGISTRY_URL || '192.168.1.50:5000' }}
          IMAGE_NAME: aurora-dashboard
          IMAGE_TAG: latest
        run: |
          set -e
          echo "Building $REGISTRY/$IMAGE_NAME:$IMAGE_TAG"
          docker build -t "$REGISTRY/$IMAGE_NAME:$IMAGE_TAG" .
          echo "Pushing $REGISTRY/$IMAGE_NAME:$IMAGE_TAG"
          docker push "$REGISTRY/$IMAGE_NAME:$IMAGE_TAG"

      # 2. Trigger Portainer to Pull & Update
      - name: Trigger Portainer Webhook
        if: ${{ secrets.PORTAINER_WEBHOOK_URL != '' }}
        run: |
          curl -s -X POST "$PORTAINER_WEBHOOK_URL" || true
        env:
          PORTAINER_WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
