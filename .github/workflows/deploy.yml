name: Deploy Aurora Dashboard

on:
  push:
    branches: [ "main" ]

jobs:
  build-push-trigger:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Optional registry login
        env:
          REGISTRY: ${{ vars.REGISTRY_URL }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          set -e
          if [ -n "$REGISTRY" ] && [ -n "$REGISTRY_USERNAME" ] && [ -n "$REGISTRY_PASSWORD" ]; then
            echo "Logging in to $REGISTRY"
            echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY" -u "$REGISTRY_USERNAME" --password-stdin
          else
            echo "Skipping registry login (missing REGISTRY/credentials)"
          fi

      # 1. Build & Push to Local/Remote Registry
      - name: Build and Push Docker Image
        env:
          REGISTRY: ${{ vars.REGISTRY_URL || '192.168.1.50:5000' }}
          IMAGE_NAME: aurora-dashboard
          IMAGE_TAG: latest
        run: |
          set -e
          echo "Building $REGISTRY/$IMAGE_NAME:$IMAGE_TAG"
          docker build -t "$REGISTRY/$IMAGE_NAME:$IMAGE_TAG" .
          echo "Pushing $REGISTRY/$IMAGE_NAME:$IMAGE_TAG"
          docker push "$REGISTRY/$IMAGE_NAME:$IMAGE_TAG"
